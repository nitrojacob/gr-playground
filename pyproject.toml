[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gr-playground"
version = "0.1.0"
description = "A GNU Radio Playground for LLM Agents to Build and Verify Signal Analysis & DSP Skills"
readme = "README.md"
authors = [
    { name = "GNU Radio LLM Agent Team" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]


[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
